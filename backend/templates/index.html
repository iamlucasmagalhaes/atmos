<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Therma32 - Monitoramento Inteligente</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #020617;
      color: #e5e7eb;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
    }

    .normal {
      background: #064e3b;
      color: #d1fae5;
    }

    .alerta {
      background: #7f1d1d;
      color: #fee2e2;
    }

    .temp {
      font-size: 2.2rem;
      margin: 15px 0;
    }

    canvas {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌡️ Therma32</h1>
    <p>Sistema Inteligente de Monitoramento Térmico</p>

    <div class="temp">
      <span id="tempAtual">--</span> °C
    </div>

    <div id="status" class="status normal">
      STATUS: NORMAL
    </div>

    <canvas id="graficoTemperatura"></canvas>
  </div>

  <script>
    const tempAtual = document.getElementById("tempAtual");
    const statusDiv = document.getElementById("status");
    const ctx = document.getElementById("graficoTemperatura");

    const labels = [];
    const dados = [];

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "Temperatura (°C)",
          data: dados,
          borderWidth: 2,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: false
          }
        }
      }
    });

    // Histórico inicial
    fetch("/api/leituras?limit=20")
      .then(res => res.json())
      .then(data => {
        data.reverse().forEach(l => {
          labels.push(new Date(l.timestamp).toLocaleTimeString());
          dados.push(l.temperatura);
        });
        chart.update();
      });

    // Socket.IO
    const socket = io();

    socket.on("atualizacao_dados", payload => {
      const hora = new Date().toLocaleTimeString();

      tempAtual.textContent = payload.temperatura;

      labels.push(hora);
      dados.push(payload.temperatura);

      if (labels.length > 20) {
        labels.shift();
        dados.shift();
      }

      if (payload.alerta) {
        statusDiv.textContent = "STATUS: ALERTA";
        statusDiv.className = "status alerta";
      } else {
        statusDiv.textContent = "STATUS: NORMAL";
        statusDiv.className = "status normal";
      }

      chart.update();
    });
  </script>

</body>
</html>
